<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dark KittyBorn</title>
</head>
<body>
<div id="game"></div>
<div id="joyBase" hidden><div id="joyKnob"></div></div>

<div class="hud" id="hudL">
  <div class="strip">
    <div class="cell" id="coins"><span class="coin"></span><span id="coinN">0</span></div>
    <div class="cell" id="bag"><span class="bagg"></span><span id="bagN">0/12</span></div>
    <div class="cell" id="clock"></div>
    <div class="cell" id="hearts" hidden></div>
  </div>
  <div id="hint" class="off"></div>
</div>
<div class="hud" id="hudR">
  <button class="btn build" id="bBuild" aria-label="Будівництво"></button>
  <button class="btn" id="bFull" aria-label="На весь екран"></button>
  <button class="btn" id="bSnd" aria-label="Звук"></button>
  <button class="btn" id="bMenu" aria-label="Меню"></button>
</div>
<div id="toast"><b></b><span></span></div>
<div id="card"></div>
<button id="chip" hidden></button>
<div id="drawer">
  <div class="dtop"><div id="buildHint"></div><div id="ghostWhy" aria-live="polite"></div>
    <div class="dbtns"><button class="ubtn ok" id="bOk" hidden>Поставити</button><button class="btn" id="bCancel" aria-label="Закрити"></button></div></div>
  <div id="bdesc"></div>
  <div id="tabs"></div>
  <div id="blist"></div>
</div>
<div id="bossbar" hidden><div class="n">Звір Блідого Місяця</div><div class="b"><div class="f" id="bossF"></div></div></div>
<div class="band" id="dead"><b>ПАДІННЯ</b><span>Рюкзак розсипався. Отямишся біля Великого Костра.</span></div>
<div class="band gold" id="win"><b>ЗДОБИЧ ВПОЛЮВАНО</b><span>Звір Блідого Місяця більше не прийде цієї ночі.</span></div>

<div id="menu" hidden>
  <div class="mcard">
    <h2>Пауза</h2>
    <div class="st" id="stats"></div>
    <div class="mrow"><button class="ubtn" id="mResume">Грати далі</button><button class="ubtn" id="mMusic">Музика: так</button></div>
    <h3>Перенести збереження</h3>
    <textarea id="mCode" rows="3" placeholder="Тут з'явиться код збереження, або встав сюди свій код"></textarea>
    <div class="mrow"><button class="ubtn" id="mExport">Отримати код</button><button class="ubtn" id="mImport">Завантажити з коду</button></div>
    <div class="st" id="mStatus" aria-live="polite"></div>
    <div class="mrow"><button class="ubtn ghost" id="mReset">Почати спочатку</button></div>
  </div>
</div>

<div id="title">
  <div class="tin">
    <div class="sigil"></div>
    <h1>Dark <em>KittyBorn</em></h1>
    <p>Ліхтарник, Профспілка Котів і ніч, що приходить по світло.</p>
    <button class="big" id="bStart">Почати</button>
    <div class="tag">Тримай вогонь. Решта — справа котів.</div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
