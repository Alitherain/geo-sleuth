name: Drovoborn APK
on:
  push:
    paths: ['drovoborn/**', '.github/workflows/drovoborn-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: bash drovoborn/android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Drovoborn-apk
          path: drovoborn/Drovoborn.apk
      - name: Commit APK to the branch
        if: github.ref_type == 'branch'
        run: |
          mkdir -p drovoborn/dist && cp drovoborn/Drovoborn.apk drovoborn/dist/Drovoborn.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f drovoborn/dist/Drovoborn.apk
          git diff --cached --quiet || (git commit -m "Build Drovoborn.apk" && git push)
